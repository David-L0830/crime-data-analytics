; Move php-fpm off its default port 9000 so nginx can bind that port itself
; when PORT is unset (the docker-compose case). Nginx reaches php-fpm here —
; see the fastcgi_pass in docker/nginx.conf.template.
[www]
listen = 127.0.0.1:9001

; Surface php-fpm's worker output in `docker logs` / the Render log stream
; instead of swallowing it, so a 500 is diagnosable without shell access.
catch_workers_output = yes
decorate_workers_output = no
