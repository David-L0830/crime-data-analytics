name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The Vitest suite runs in a Node environment against the pure helpers
      # in src/utils (see vitest.config.js) — no browser, no services, no
      # secrets. It was previously the only check in the repository that CI
      # never ran, so a regression in the KPI/forecast/month-grouping helpers
      # could reach main with a green tick. TZ is pinned in vitest.setup.js,
      # so this passes identically on the runner's UTC clock and locally.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, curl, intl, bcmath, gd, zip, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Code style check (Pint)
        run: php ./vendor/bin/pint --test
        continue-on-error: true

      # The test suite runs against an in-memory SQLite database and a
      # dummy APP_KEY, both defined directly in backend/phpunit.xml — no
      # Postgres/Supabase service container or secrets are needed here.
      - name: Run backend test suite
        run: php artisan test
